@font-face{font-family:"Thmanyah Sans";src:url("fonts/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("fonts/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("fonts/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyahserifdisplay-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif Display";src:url("fonts/thmanyahserifdisplay-Black.woff2") format("woff2");font-weight:900;font-display:swap}

/* Layout: "chart paper" — a faint graph-paper ground; the plan reads like a figure (rows = levels, points = courses),
   with a number-line GPA gauge and a viridis-inspired palette borrowed from statistical plotting. */
:root{
  color-scheme: light;
  --bg:#F4F6F9;  --grid:#E4E9F0;  --surface:#FFFFFF;  --sunk:#EDF1F6;  --line:#DCE2EB;
  --ink:#1B2536; --muted:#667389;
  --accent:#1E8A85;  --accent-soft:#DDF1EF;          /* viridis teal */
  --deep:#3E3A8C;    --deep-soft:#E7E6F6;            /* viridis indigo */
  --f:#EF6351;       --f-soft:#FDE6E2;               /* the signature F */
  --done:#2E9B5B;    --done-soft:#E1F3E8;
  --open:#3E5BB0;    --open-soft:#E5EBF8;
  --fail:#D64550;    --fail-soft:#FBE5E7;
  --lock:#A3ADBD;
  --retry:#16181D;   --retry-soft:#E3E5EA;
  --warn:#9A6B00;    --warn-soft:#FBF0D6;
  --g1:#46327E; --g2:#365C8D; --g3:#277F8E; --g4:#1FA187; --g5:#4AC16D; --g6:#A0DA39; --g7:#D9B70E;
  --shadow:0 1px 2px rgba(27,37,54,.05),0 6px 20px rgba(27,37,54,.05);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-th-display:"Thmanyah Serif Display","Thmanyah Sans",Georgia,serif;
  --font-th-body:"Thmanyah Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0F141C; --grid:#18202B; --surface:#151C26; --sunk:#1B2430; --line:#26303E;
  --ink:#E4EAF3; --muted:#8C98AB;
  --accent:#3CC1B8; --accent-soft:#163633;
  --deep:#9C95F0;   --deep-soft:#24224A;
  --f:#FF8064;      --f-soft:#3A201B;
  --done:#5CCB86;   --done-soft:#16301F;
  --open:#7E9BF0;   --open-soft:#1B2645;
  --fail:#FF6B74;   --fail-soft:#3A1B20;
  --lock:#58657A;
  --retry:#F2F4F8;   --retry-soft:#2B3341;
  --warn:#E8B64A;   --warn-soft:#33290F;
  --g1:#8C76E0; --g2:#5E8BD0; --g3:#3FA9B8; --g4:#2FC3A0; --g5:#6BD486; --g6:#B5E35A; --g7:#F0CF3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F141C; --grid:#18202B; --surface:#151C26; --sunk:#1B2430; --line:#26303E;
  --ink:#E4EAF3; --muted:#8C98AB;
  --accent:#3CC1B8; --accent-soft:#163633;
  --deep:#9C95F0;   --deep-soft:#24224A;
  --f:#FF8064;      --f-soft:#3A201B;
  --done:#5CCB86;   --done-soft:#16301F;
  --open:#7E9BF0;   --open-soft:#1B2645;
  --fail:#FF6B74;   --fail-soft:#3A1B20;
  --lock:#58657A;
  --retry:#F2F4F8;   --retry-soft:#2B3341;
  --warn:#E8B64A;   --warn-soft:#33290F;
  --g1:#8C76E0; --g2:#5E8BD0; --g3:#3FA9B8; --g4:#2FC3A0; --g5:#6BD486; --g6:#B5E35A; --g7:#F0CF3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
html,body{background-color:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed}
*{box-sizing:border-box}
[hidden]{display:none!important}
#onboard{--font-display:var(--font-th-display);--font-body:var(--font-th-body);font-family:var(--font-th-body)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.86em;letter-spacing:.2px}
.serif{font-family:var(--font-display)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .logo{width:44px;height:50px;flex:none}
.grains circle{animation:fall 1.8s linear infinite}
.grains circle:nth-child(2){animation-delay:-.6s}.grains circle:nth-child(3){animation-delay:-1.2s}
@keyframes fall{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}85%{opacity:1}100%{transform:translateY(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.grains circle{animation:none}}
.brand .ar{font-family:var(--font-th-display);font-weight:900;font-size:38px;line-height:1;color:var(--deep)}
.brand .sep{width:1px;height:22px;background:var(--line);align-self:center}
.brand .en{font-family:var(--font-th-display);font-weight:700;font-size:22px;direction:ltr;unicode-bidi:isolate;line-height:1.1}
.en-stack{display:inline-flex;flex-direction:column;align-items:stretch;gap:2px}
.tagline{font-family:var(--font-body);font-weight:500;color:var(--muted);line-height:1.2;white-space:nowrap;font-size:10px;display:flex;justify-content:flex-start;gap:3px}
[dir="ltr"] .tagline{font-family:var(--font-mono);font-weight:500;font-size:8.5px;text-transform:uppercase}
.brand .en b{color:var(--f);font-weight:900}
.brand small{color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--fail)}
.icon-btn{width:38px;height:38px;padding:0;display:inline-grid;place-items:center;border-radius:50%}
.lang-btn{font-family:var(--font-mono);font-weight:500;font-size:13px;min-width:44px}
.icon-btn svg{width:18px;height:18px}
.top-left{display:flex;gap:8px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center;padding-block:18px 8px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero h1{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.2;margin:0 0 12px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--f)}
.hero p{margin:0;color:var(--muted);max-width:56ch;font-size:16px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 10px;box-shadow:var(--shadow)}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.curve{fill:none;stroke-width:2.5}
.curve.main{stroke:var(--deep)}
.curve.alt{stroke:var(--muted);stroke-dasharray:5 5;opacity:.55}
.curve.alt2{stroke:var(--accent);stroke-dasharray:2 5;opacity:.8}
.area{fill:var(--deep-soft)}
.axis{stroke:var(--line);stroke-width:1.5}
.tick{stroke:var(--muted);stroke-width:1}
.tick-label{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.marker{stroke:var(--f);stroke-width:2;stroke-dasharray:3 3}
.marker-dot{fill:var(--f)}
.marker-label{fill:var(--f);font-family:var(--font-body);font-size:13px;font-weight:700}

.choose{margin-top:26px}
.gender{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;font-size:14px;color:var(--muted)}
.gpill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:14.5px;transition:border-color .15s}
.gpill:hover{border-color:var(--accent)}
.gpill.on{border-color:var(--deep);background:var(--deep-soft);color:var(--deep);font-weight:700}
.choose h2{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0 0 4px}
.choose p{margin:0 0 14px;color:var(--muted);font-size:14px}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.track{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.track:hover{border-color:var(--accent);transform:translateY(-2px)}
.track .top-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.track .t{font-family:var(--font-display);font-size:21px;font-weight:700}
.track .h{font-family:var(--font-display);font-size:42px;font-weight:900;color:var(--deep);line-height:1}
.track.ai .h{color:var(--f)}
.track .h small{font-family:var(--font-body);font-size:14px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.keys span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-inline-end:5px;vertical-align:middle}
.go{color:var(--accent);font-size:14px;font-weight:500}

/* summary */
.summary{display:grid;grid-template-columns:1fr 1.35fr;gap:16px;margin-bottom:20px}
@media (max-width:860px){.summary{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.label{font-size:12.5px;color:var(--muted)}
.kpi{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi .big{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1.05}
.kpi .big.th{font-family:var(--font-th-display);font-weight:900;font-size:46px}
.gpa-row{display:flex;align-items:center;gap:18px}
.ring{--p:0;width:148px;height:148px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--deep) calc(var(--p)*1%),var(--sunk) 0)}
.ring>div{width:130px;height:130px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.05}
.ring b{font-family:var(--font-th-display);font-weight:900;font-size:34px;display:block;margin:2px 0 0}
.ring .ring-label{margin:0;font-size:11px;color:var(--muted);white-space:nowrap}
.ring small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.gpa-meta{display:grid;gap:6px;min-width:0}
.kpi .of{color:var(--muted);font-size:14px}
.rank{width:fit-content;display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--deep-soft);color:var(--deep)}
.ruler svg{display:block;width:100%;height:auto;margin-top:10px;direction:ltr}
.zone1{fill:color-mix(in srgb,var(--accent) 45%,var(--surface))} .zone2{fill:color-mix(in srgb,var(--done) 18%,var(--surface))}
.honor-keys{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:4px}
.honor-keys span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);border:1px solid var(--line);margin-inline-end:6px;vertical-align:middle}
.honor-keys .mono{color:var(--ink);direction:ltr;unicode-bidi:isolate}
.zone-label{fill:var(--muted);font-family:var(--font-body);font-size:10.5px}
.gpa-mark{fill:var(--f)}
.gpa-text{fill:var(--ink);font-family:var(--font-mono);font-size:12px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
.grad .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--accent);width:fit-content}
.bar{display:flex;height:16px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:14px 0 4px;gap:0}
.bar i{display:block;height:100%;border-inline-end:1.5px solid var(--surface)}
.bar-axis{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--muted);direction:ltr}
.bar-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.bar-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-inline-end:5px;vertical-align:middle}
.bar-legend b{color:var(--ink);font-weight:500}
.terms{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:grid;gap:6px}
.terms .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.terms input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.terms .est{font-family:var(--font-display);font-weight:700;font-size:20px}
.terms .est b{color:var(--f);font-weight:900}

.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner.sample{background:var(--warn-soft);color:var(--warn)}
.banner.confirm{background:var(--fail-soft);color:var(--fail);justify-content:flex-start}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pt{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c)}
.pt.hollow{background:transparent;border:2px solid var(--c)}

/* plan */
.section-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin:28px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec{margin-top:14px}
.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);transition:border-color .15s}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{border-color:var(--accent)}
.sec>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sec>summary .section-title{margin:0;font-size:20px}
.sec[open]>summary{margin-bottom:12px}
.sec-prog{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;direction:ltr}
.sec-prog .minibar{width:90px;margin:0;--c:var(--accent)}
.sec-open{display:inline-flex;align-items:center;gap:5px}
.chev{width:18px;height:18px;transition:transform .2s}
.sec[open] .chev{transform:rotate(180deg)}
.section-title .mono{direction:ltr;unicode-bidi:isolate;font-family:var(--font-mono);font-size:12.5px;color:var(--accent);font-weight:500}
.section-title small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:400}
.level{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;padding:12px 0;border-top:1px dashed var(--line)}
.level:first-child{border-top:0;padding-top:0}
.level:last-child{padding-bottom:0}
.level .lv{padding-top:8px}
.level .lv b{display:block;font-family:var(--font-display);font-size:17px;font-weight:700}
.level .lv span{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.pass-btn{display:block;margin-top:8px;border:1px solid color-mix(in srgb,var(--done) 45%,var(--line));background:var(--done-soft);color:var(--done);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.pass-btn:hover{border-color:var(--done)}
.pass-note{margin:0 0 4px;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pass-note b{color:var(--done);font-weight:500;white-space:nowrap}
.pass-btn.undo{background:transparent;color:var(--muted);border-color:var(--line)}
@media (max-width:560px){.pass-btn{margin-top:0;margin-inline-start:auto}}
@media (max-width:560px){.level{grid-template-columns:1fr;gap:8px}.level .lv{padding-top:0;display:flex;gap:10px;align-items:baseline}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tile{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-height:78px;transition:border-color .12s,box-shadow .12s,opacity .12s,background .12s}
.tile .code{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
.tile .code .c{direction:rtl;unicode-bidi:isolate}
[dir="ltr"] .tile .code .c{direction:ltr}
.tile .name{font-weight:500;font-size:14px;line-height:1.4}
.tile .st{font-size:12px;display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--muted)}
.tile .st .pt{width:8px;height:8px}
.tile .grade{font-weight:500;color:var(--done);direction:ltr;unicode-bidi:isolate}
.tile.done{background:var(--done-soft);border-color:transparent}
.tile.done .st{color:var(--done)}
.tile.open{border-color:color-mix(in srgb,var(--open) 50%,var(--line))}
.tile.open .st{color:var(--open)}
.tile.retry{background:var(--retry-soft);border-color:var(--retry)}
.tile.retry .st,.tile.retry .grade{color:var(--retry);font-weight:700}
.tile.locked{background:transparent;border-style:dashed}
.tile.locked .name{color:var(--muted)}
.tile.extra{opacity:.55}
.tile:hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tile.is-pre{background:var(--fail-soft);border-color:var(--fail);border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--fail) 18%,transparent)}
.tile.is-unl{background:var(--open-soft);border-color:var(--open);border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--open) 18%,transparent)}
.tile.is-pre .name,.tile.is-unl .name{color:var(--ink)}
.dim .tile:not(.sel):not(.is-pre):not(.is-unl){opacity:.4}

.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.group{min-width:0}
.group h3{margin:0 0 2px;font-family:var(--font-display);font-size:17px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.group h3 .num{font-family:var(--font-mono);font-size:13px;color:var(--accent);font-weight:500;direction:ltr}
.group .note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.minibar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-bottom:12px}
.minibar i{display:block;height:100%;background:var(--c)}
.group .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

/* what-if */
.wi-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13.5px;color:var(--muted)}
.wi-top select,.mod select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.plans{grid-template-columns:1fr}}
.plan-card{display:grid;gap:12px;align-content:start;min-width:0}
.plan-card.b{border-color:color-mix(in srgb,var(--f) 45%,var(--line))}
.plan-card h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.plan-card h3 .tag{font-family:var(--font-mono);font-size:12px;border-radius:6px;padding:1px 7px;background:var(--deep-soft);color:var(--deep)}
.plan-card.b h3 .tag{background:var(--f-soft);color:var(--f)}
.res{display:grid;gap:2px}
.res .when{font-family:var(--font-th-display);font-weight:900;font-size:26px;line-height:1.2}
.res .sub{font-size:13px;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--f)}
.plan-card:not(.b) .ctl input[type=range]{accent-color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.switch input{accent-color:var(--f);width:16px;height:16px}
.mods{display:grid;gap:8px}
.mod{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--sunk);border-radius:12px;padding:8px 10px;font-size:13.5px}
.mod b{font-weight:500}
.mod select{flex:1;min-width:150px}
.mod .rm{border:0;background:var(--surface);border-radius:50%;width:24px;height:24px;line-height:1;padding:0;margin-inline-start:auto}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.btn.add{border-style:dashed;color:var(--f);border-color:color-mix(in srgb,var(--f) 50%,var(--line))}
.verdict{margin-top:16px;display:grid;gap:8px}
.verdict .head{font-family:var(--font-display);font-weight:700;font-size:19px}
.verdict .head b{color:var(--f)}
.verdict .head.same b{color:var(--done)}
.verdict .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12.5px;background:var(--sunk);color:var(--ink)}
.pill .mono{color:var(--f)}
.tl-tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--surface);margin:18px 0 10px}
.tl-tabs button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:13px}
.tl-tabs button.on{background:var(--ink);color:var(--surface)}
.timeline{overflow-x:auto;padding-bottom:6px}
.terms-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;min-width:min-content}
.term{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;align-content:start}
.term.summer{background:color-mix(in srgb,var(--g7) 10%,var(--surface));border-style:dashed}
.term.grad{border-color:var(--done);box-shadow:0 0 0 2px var(--done-soft)}
.term h4{margin:0;font-size:13px;color:var(--ink);font-weight:700;display:flex;justify-content:space-between;gap:6px}
.term h4 .mono{color:var(--muted);font-weight:400}
.term .greg{font-size:11.5px;color:var(--muted);margin-top:-4px}
.term .warn{font-size:11.5px;color:var(--warn)}
.chipc{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;border-radius:8px;padding:4px 8px;background:var(--sunk)}
.chipc .mono{color:var(--muted);white-space:nowrap}
.chipc.slot{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chipc.fail{background:var(--retry-soft);color:var(--retry);text-decoration:line-through;text-decoration-thickness:1px}
.chipc.moved{box-shadow:inset 0 0 0 1.5px var(--f)}
.chipc.ai{background:var(--f-soft)}
.wi-note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* أدوات «لو» lab */
.lab{margin-top:22px;border-radius:20px;border:1.5px solid color-mix(in srgb,var(--deep) 35%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--deep) 9%,var(--surface)),var(--surface) 140px);box-shadow:var(--shadow);overflow:hidden}
.lab-head{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px}
.lab-head::-webkit-details-marker{display:none}
.lab-head:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
.lab-logo{width:40px;height:46px;flex:none}
.lab-title{display:grid;gap:2px;flex:1;min-width:0}
.lab-title>span{font-family:var(--font-th-display);font-weight:900;font-size:26px;line-height:1.15;color:var(--deep)}
.lab-title small{font-size:13px;color:var(--muted)}
.lab[open] .lab-head .chev{transform:rotate(180deg)}
.lab-body{padding:0 18px 20px;border-top:1px dashed color-mix(in srgb,var(--deep) 25%,var(--line))}
.lab-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
.lab-tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500}
.lab-tabs button:hover{border-color:var(--deep)}
.lab-tabs button.on{background:var(--deep);border-color:var(--deep);color:var(--surface)}
.lab-lead{margin:6px 0 14px;font-size:13.5px;color:var(--muted)}

/* monte carlo */
.forecast{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;border-radius:16px;padding:18px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--open) 14%,var(--surface)),color-mix(in srgb,var(--deep) 10%,var(--surface)))}
@media (max-width:560px){.forecast{grid-template-columns:1fr}}
.forecast .sky{font-size:64px;line-height:1}
.forecast .kicker{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.forecast h3{margin:2px 0 8px;font-family:var(--font-th-display);font-weight:900;font-size:24px;line-height:1.3}
.forecast ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.forecast li b{font-family:var(--font-mono);font-weight:500;color:var(--deep)}
.mc-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}
@media (max-width:860px){.mc-grid{grid-template-columns:1fr}}
.chart-card{min-width:0;display:grid;gap:8px;align-content:start}
.chart-card h4{margin:0;font-size:15px;color:var(--ink);font-weight:700;font-family:var(--font-display)}
.chart-card .hint{margin:0}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.hbar{fill:var(--deep)} .hbar.hi{fill:var(--f)}
.hbar:hover{opacity:.8}
.thr{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.thr-l{fill:var(--muted);font-family:var(--font-body);font-size:10.5px}
.med{stroke:var(--f);stroke-width:2}
.med-l{fill:var(--f);font-family:var(--font-mono);font-size:11px;font-weight:500}
.ax{stroke:var(--line);stroke-width:1}
.axl{fill:var(--muted);font-family:var(--font-mono);font-size:10.5px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;border-radius:8px;padding:5px 8px;white-space:nowrap;transform:translate(-50%,-120%);font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate}
.gbars{display:grid;gap:8px}
.gbar{display:grid;grid-template-columns:minmax(110px,auto) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.gbar .track2{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.gbar .track2 i{display:block;height:100%;background:var(--deep);border-radius:0 4px 4px 0}
[dir="rtl"] .gbar .track2 i{border-radius:4px 0 0 4px;margin-inline-start:0}
.gbar .pct{font-family:var(--font-mono);text-align:end}
.gbar.base .track2 i{background:var(--done)}
.method{margin-top:16px;font-size:13.5px}
.method summary{cursor:pointer;color:var(--deep);font-weight:500}
.method .eq{font-family:var(--font-mono);background:var(--sunk);border-radius:10px;padding:10px 12px;margin:8px 0;direction:ltr;text-align:left;overflow-x:auto;font-size:12.5px;line-height:1.8}
.method table{border-collapse:collapse;font-size:13px}
.method td{padding:4px 10px;border-bottom:1px solid var(--line)}
.method td:last-child{font-family:var(--font-mono);direction:ltr}

/* alerts + elective helper */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:10px 14px;font-size:14px}
.alert .ic{font-size:16px;line-height:1.5}
.alert .tx{flex:1;min-width:0}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.alert.bad{background:var(--fail-soft);border-color:color-mix(in srgb,var(--fail) 35%,var(--line))}
.alert .x{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 4px}
.alert .link{border:0;background:none;padding:0;color:var(--open);text-decoration:underline;text-underline-offset:3px;font:inherit}
.helper{margin-bottom:16px;border-color:color-mix(in srgb,var(--open) 40%,var(--line))}
.helper h3{margin:0 0 2px;font-family:var(--font-display);font-size:17px;font-weight:700}
.helper .note{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.sugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.sug{display:grid;gap:6px;align-content:start}
.sug .tile{min-height:0}
.why{display:flex;flex-wrap:wrap;gap:4px}
.why span{font-size:11.5px;border-radius:999px;padding:1px 8px;background:var(--open-soft);color:var(--open)}
.why span.g{background:var(--sunk);color:var(--muted)}

/* ratings */
.rate{border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:12px}
.rate h3{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700}
.rsum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px}
.rsum b{font-family:var(--font-mono);font-weight:500}
.rbar{height:8px;border-radius:4px;background:var(--fail-soft);overflow:hidden;flex:1;min-width:120px}
.rbar i{display:block;height:100%;background:var(--done)}
.rform{display:grid;gap:10px;background:var(--sunk);border-radius:12px;padding:12px}
.rrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.rrow .lbl{color:var(--muted);min-width:64px}
.rchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px}
.rchip.on{border-color:var(--deep);background:var(--deep-soft);color:var(--deep);font-weight:700}
.rform textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical;min-height:64px;width:100%}
.rform .cnt{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-align:end}
.rerr{font-size:12.5px;color:var(--fail)} .rok{font-size:12.5px;color:var(--done)}
.rnote{font-size:12px;color:var(--muted)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--surface)}
.btn.primary:hover{color:var(--surface);filter:brightness(1.08)}
.comments{display:grid;gap:8px}
.cmt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;display:grid;gap:4px}
.cmt .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.cmt .rep{margin-inline-start:auto;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:0}
.demo{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}

/* gpa tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.tools{grid-template-columns:1fr}}
.tool{display:grid;gap:12px;align-content:start;min-width:0}
.tool h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700}
.tool p.lead{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.field input,.field select{font:inherit;font-family:var(--font-mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px}
.presets button.on{border-color:var(--deep);background:var(--deep-soft);color:var(--deep);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;width:fit-content}
.seg button{border:0;background:none;border-radius:999px;padding:4px 12px;font-size:12.5px}
.seg button.on{background:var(--ink);color:var(--surface)}
.answer{border-radius:12px;padding:14px;background:var(--sunk);display:grid;gap:6px}
.answer .big{font-family:var(--font-th-display);font-weight:900;font-size:30px;line-height:1.15}
.answer .big small{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--muted)}
.answer.ok{background:var(--done-soft)} .answer.ok .big{color:var(--done)}
.answer.no{background:var(--fail-soft)} .answer.no .big{color:var(--fail)}
.answer .mix{font-size:13.5px}
.rangebar{position:relative;height:30px;margin:18px 0 8px;direction:ltr}
.rangebar .rb-track{position:absolute;top:12px;left:0;right:0;height:6px;border-radius:3px;background:var(--line)}
.rangebar .rb-span{position:absolute;top:12px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.rangebar .m{position:absolute;top:4px;width:2px;height:22px;background:var(--ink)}
.rangebar .m.t{background:var(--f);width:3px}
.rangebar .lab{position:absolute;top:-12px;transform:translateX(-50%);font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.rangebar .m.t .lab{color:var(--f);font-weight:500}
.ftable{width:100%;border-collapse:collapse;font-size:13.5px}
.ftable td{padding:7px 8px;border-bottom:1px solid var(--line)}
.ftable tr:last-child td{border-bottom:0}
.ftable td.g{font-family:var(--font-mono);font-weight:500;width:48px}
.ftable td.n{font-family:var(--font-mono);text-align:end;white-space:nowrap}
.ftable tr.ok td.n{color:var(--done)} .ftable tr.no td{color:var(--lock)} .ftable tr.no td.n{color:var(--fail)}
.ftable tr.pick{background:var(--deep-soft)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--accent)}

/* record */
.record{overflow-x:auto}
.record table{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.record th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line)}
.record td{padding:8px 10px;border-bottom:1px solid var(--line)}
.record tr:last-child td{border-bottom:0}
.record td.g{font-family:var(--font-mono);font-weight:500;direction:ltr;text-align:start}
.record tr.f td.g{color:var(--fail)}
.record tfoot td{font-weight:700;border-top:1.5px solid var(--line);border-bottom:0}
.empty{color:var(--muted);font-size:14px;margin:0}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.35);z-index:30}
@media (min-width:641px){.scrim{display:none}}
.drawer{position:fixed;z-index:31;top:0;bottom:0;inset-inline-end:0;width:min(410px,100%);background:var(--surface);border-inline-start:1px solid var(--line);
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:var(--shadow);display:grid;gap:16px;align-content:start}
@media (max-width:640px){.drawer{top:auto;inset-inline:0;width:100%;max-height:84vh;border-inline-start:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}}
.drawer .x{justify-self:end;border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;font-size:18px;line-height:1}
.drawer h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.3;text-wrap:balance}
.drawer .sub{color:var(--muted);font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.reqs{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.reqs li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.reqs .ok{color:var(--done)} .reqs .no{color:var(--fail)}
.reqs button{border:0;background:none;padding:0;text-align:start;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.reqs button:hover{text-decoration-color:var(--accent)}
.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-family:var(--font-mono);font-weight:500}
.grades button:hover{border-color:var(--accent)}
.grades button.on{background:var(--deep);border-color:var(--deep);color:var(--surface)}
.grades button.fbtn.on{background:var(--fail);border-color:var(--fail)}
.grades button small{display:block;font-size:10px;color:var(--muted)}
.grades button.on small{color:inherit;opacity:.8}
.attempts{display:flex;flex-wrap:wrap;gap:6px}
.att{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:3px 6px;padding-inline-start:10px;background:var(--sunk);font-size:13px}
.att b{font-family:var(--font-mono);font-weight:500;direction:ltr}
.att.f b{color:var(--fail)}
.att button{border:0;background:var(--surface);border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;padding:0}
.box{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:13.5px}
.box.warn{background:var(--warn-soft);color:var(--warn)}
h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:500}
footer{margin-top:44px;color:var(--muted);font-size:12.5px;text-align:center}
footer .li{display:inline-flex;align-items:center;gap:4px;color:var(--open);text-decoration:none;margin-inline-start:6px;font-weight:500}
footer .li:hover{text-decoration:underline}
footer .li svg{width:13px;height:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="root" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 72" aria-hidden="true"><symbol id="logoMark" viewBox="0 0 64 72">

  for (let i = 0; i <= 60; i++) { const z = mark + i * (3.6 - mark) / 60; area += `L${X(z).toFixed(1)} ${(base - pdf(z, 0, 1) * k).toFixed(1)}`; }

  $("record").innerHTML = `<table><thead><tr>${t.th.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr class="${r.g === "F" ? "f" : ""}"><td><span class="mono">${esc(cd(r.c))}</span> · ${esc(nm(r.c))}</td><td class="mono">${r.c.hrs}</td><td>${r.multi ? (r.n === 0 ? t.first : t.retake(r.n)) : "—"}</td><td class="g">${r.g}</td><td class="mono">${(PTS[r.g] * r.c.hrs).toFixed(2)}</td></tr>`).join("")
  }</tbody><tfoot><tr><td>${t.totalRow}</td><td class="mono">${G.hrs}</td><td></td><td class="g">x̄ = ${G.v.toFixed(2)}</td><td class="mono">${G.pts.toFixed(2)}</td></tr></tfoot></table>`;
}

function renderDrawer() {
  const d = $("drawer"), t = L();
  if (!selected) { d.hidden = true; $("scrim").hidden = true; return; }
  const c = BY[selected], st = status(c), a = attempts(c.code), rq = reqs(c), un = unlocks(c.code), last = a[a.length - 1];
  const where = c.group in CAPS ? t.groups[c.group][0] : (c.group === "y1" ? t.secY1 : t.level(c.level));
  const soft = { done:"var(--done-soft)", open:"var(--open-soft)", retry:"var(--retry-soft)", locked:"var(--sunk)" }[st];
  let h = `<button class="x" type="button" id="closeD" aria-label="${t.close}">×</button>
    <div><h2>${esc(nm(c))}</h2><div class="sub"><span class="mono">${esc(cd(c))}</span><span>${t.creditHrs(c.hrs)}</span><span>${where}</span></div></div>
    <span class="chip" style="background:${soft};color:${STATE_COLOR[st]}">${t.st[st]}</span>`;
  if (st !== "done" && groupFull(c.group)) h += `<div class="box warn">${t.fullWarn}</div>`;
  h += `<div><h4>${t.reqs}</h4>${rq.length ? `<ul class="reqs">${rq.map(r => `<li><span class="${r.ok ? "ok" : "no"}">${r.ok ? "✓" : "✗"}</span>${r.code ? `<button type="button" data-go="${esc(r.code)}"><span class="mono">${esc(cd(BY[r.code]))}</span> · ${esc(nm(BY[r.code]))}</button>` : `<span>${esc(r.label)}</span>`}</li>`).join("")}</ul>` : `<p class="hint" style="margin:0">${t.noReqs}</p>`}</div>`;
  if (un.length) h += `<div><h4>${t.opens}</h4><ul class="reqs">${un.map(u => `<li><span style="color:var(--open)">${S.lang === "ar" ? "←" : "→"}</span><button type="button" data-go="${esc(u.code)}"><span class="mono">${esc(cd(u))}</span> · ${esc(nm(u))}</button></li>`).join("")}</ul></div>`;
  if (st !== "locked" || a.length) {
    h += `<div><h4>${last === "P" ? t.pPick : a.length ? (last === "F" ? t.retakeGrade : t.yourGrade) : t.pickGrade}</h4>
      <div class="grades">${GRADES.map(([gr, pt]) => `<button type="button" class="${gr === "F" ? "fbtn " : ""}${a.length && last === gr ? "on" : ""}" data-grade="${gr}">${gr}<small>${pt}</small></button>`).join("")}</div></div>`;
    if (a.length) {
      h += `<div><h4>${t.attempts} <span class="hint">${t.attHint}</span></h4><div class="attempts">${a.map((gr, i) => `<span class="att${gr === "F" ? " f" : ""}">${a.length > 1 ? (i === 0 ? t.first : t.retake(i)) : t.single} <b>${gr === "P" ? "✓ " + t.noGradeShort : gr}</b><button type="button" data-del="${i}" aria-label="×">×</button></span>`).join("")}</div></div>
      ${last === "P" ? "" : `<div><button class="btn" type="button" id="addRetake">${last !== "F" ? t.addF : t.addRetake}</button></div>`}`;
    }
  } else h += `<div class="box">${t.lockedBox}</div>`;
  h += `<div class="rate" id="rateBox" data-for="${esc(c.code)}"></div>`;
  d.innerHTML = h; d.hidden = false; $("scrim").hidden = false;
  renderRating(c.code);
}

function slotName(g) { return L().slot[g]; }
function itemLabel(it) { return it.slot ? slotName(it.group) : `${cd(BY[it.id])} ${nm(BY[it.id])}`; }
function planCard(key, p, r) {
  const t = L(), isB = key === "B";
  const remaining = visible().filter(c => !passed(c.code));
  const opt = sel => remaining.map(c => `<option value="${esc(c.code)}"${c.code === sel ? " selected" : ""}>${esc(cd(c))} · ${esc(nm(c))}</option>`).join("");
  let h = `<div class="card plan-card${isB ? " b" : ""}">
    <h3><span class="tag">${key}</span>${isB ? t.wiB : t.wiA}</h3>
    <div class="res">${r.last ? `<span class="when">${termLabel(r.last.tm).name}</span><span class="sub">${termLabel(r.last.tm).greg} · ${t.wiTerms(r.regular, r.summers)}${r.gpa != null ? ` · ${t.wiGpa(r.gpa.toFixed(2))}` : ""}</span>` : `<span class="when">${t.estDone}</span>`}${r.stuck ? `<span class="sub" style="color:var(--warn)">${t.wiStuck}</span>` : ""}</div>
    <div class="ctl"><label for="load${key}">${t.wiLoad}</label><input type="range" id="load${key}" min="12" max="20" value="${p.load}"><span class="mono">${p.load}</span></div>`;
  if (ai()) h += `<label class="switch"><input type="checkbox" id="summer${key}"${p.summer ? " checked" : ""}>${t.wiSummer}</label>`;
  if (isB) {
    h += `<div class="mods">${p.mods.map((m, i) => `<div class="mod">${m.type === "delay"
        ? `<b>${t.wiDelay}</b><select data-mod="${i}" data-f="code"><option value="">${t.wiPick}</option>${opt(m.code)}</select><select data-mod="${i}" data-f="n">${[1,2,3].map(n => `<option value="${n}"${(m.n || 1) === n ? " selected" : ""}>${t.wiByN(n)}</option>`).join("")}</select>`
        : `<b>${t.wiFail}</b><select data-mod="${i}" data-f="code"><option value="">${t.wiPick}</option>${opt(m.code)}</select><span>${t.wiRetake}</span><select data-mod="${i}" data-f="grade">${GRADES.filter(([g]) => g !== "F").map(([g]) => `<option${(m.grade || "C") === g ? " selected" : ""}>${g}</option>`).join("")}</select>`}
        <button type="button" class="rm" data-rmmod="${i}" aria-label="×">×</button></div>`).join("")}</div>
      <div class="add-row"><button type="button" class="btn add" data-addmod="delay">+ ${t.wiDelay}</button><button type="button" class="btn add" data-addmod="fail">+ ${t.wiFail}</button></div>`;
  }
  return h + `</div>`;
}
function renderWhatIf() {
  const t = L(), host = $("whatif");
  if (counted().total >= total()) { host.innerHTML = `<p class="lab-lead">${t.estDone}</p>`; return; }
  const A = planA(), B = planB(), rA = runPlan(A), rB = runPlan(B);
  const open = (S.open || {}).wi !== false;
  // verdict
  const idx = r => r.last ? r.last.tm.y * 3 + r.last.tm.sem : 0;
  const dTerms = rB.regular - rA.regular, later = idx(rB) - idx(rA);
  let head = later === 0 ? `<div class="head same">${t.wiSame}</div>` : `<div class="head">${later > 0 ? t.wiLater(dTerms, termLabel(rB.last.tm).name) : t.wiEarlier(-dTerms, termLabel(rB.last.tm).name)}</div>`;
  const moved = [];
  for (const id in rB.termOf) { const a = rA.termOf[id], b = rB.termOf[id]; if (a != null && b != null && !id.startsWith("slot:")) { const ta = rA.terms[a].tm, tb = rB.terms[b].tm; const d = (tb.y * 3 + tb.sem) - (ta.y * 3 + ta.sem); if (d > 0) moved.push(id); } }
  let v = `<div class="verdict">${head}`;
  if (moved.length) v += `<div class="row">${t.wiMoved}${moved.map(id => `<span class="pill">${esc(cd(BY[id]))} · ${esc(nm(BY[id]))}</span>`).join("")}</div>`;
  if (rB.gpa != null) { const g = gpa(); const now = g && g.v !== null ? g.v : null; v += `<div class="row">${t.wiGpaRow(now != null ? now.toFixed(2) : "—", rB.gpa.toFixed(2))}</div>`; }
  v += `</div>`;
  // timeline
  const view = S.wiView === "A" ? "A" : "B", R = view === "A" ? rA : rB, other = view === "A" ? rB : rA;
  const movedSet = new Set(view === "B" ? moved : []);
  const tl = `<div class="tl-tabs" role="tablist"><button type="button" data-view="A" class="${view === "A" ? "on" : ""}">A · ${t.wiA}</button><button type="button" data-view="B" class="${view === "B" ? "on" : ""}">B · ${t.wiB}</button></div>
    <div class="timeline"><div class="terms-row">${R.terms.map((r, i) => {
      const L1 = termLabel(r.tm), last = i === R.terms.length - 1;
      return `<div class="term${r.tm.summer ? " summer" : ""}${last ? " grad" : ""}"><h4><span>${L1.name}</span><span class="mono">${r.hrs}${t.hrsShort}</span></h4><div class="greg">${L1.greg}${last ? " · 🎓" : ""}</div>
        ${!r.tm.summer && !last && r.hrs < 12 ? `<div class="warn">${t.wiLight}</div>` : ""}
        ${r.items.map(it => `<div class="chipc${it.slot ? " slot" : ""}${it.fail ? " fail" : ""}${movedSet.has(it.id) && !it.fail ? " moved" : ""}${["ai","aiel"].includes(it.group) && !it.slot ? " ai" : ""}"><span>${esc(itemLabel(it))}</span><span class="mono">${it.hrs}${t.hrsShort}</span></div>`).join("")}</div>`;
    }).join("")}</div></div>`;
  const startSel = `<div class="wi-top"><label for="startTerm">${t.wiStart}</label><select id="startTerm">${START_OPTS.map(i => `<option value="${i}"${(S.start || 0) === i ? " selected" : ""}>${termLabel(termSeq(i, false, 1)[0]).name}</option>`).join("")}</select></div>`;
  host.innerHTML = `<p class="lab-lead">${t.wiSub}</p>
    ${startSel}<div class="plans">${planCard("A", A, rA)}${planCard("B", B, rB)}</div>${v}${tl}<p class="wi-note">${t.wiNote}</p>`;
}

function renderLab() {
  const tab = ["tools","mc"].includes(S.labTab) ? S.labTab : "wi";
  $("lab").open = (S.open || {}).lab !== false;
  $("tabWi").classList.toggle("on", tab === "wi"); $("tabTools").classList.toggle("on", tab === "tools");
  $("tabWi").setAttribute("aria-selected", tab === "wi"); $("tabTools").setAttribute("aria-selected", tab === "tools");
  $("tabMc").classList.toggle("on", tab === "mc"); $("tabMc").setAttribute("aria-selected", tab === "mc");
  $("whatif").hidden = tab !== "wi"; $("tools").hidden = tab !== "tools"; $("mc").hidden = tab !== "mc";
  if (tab === "mc") renderMC();
}
function renderBanners() {
  const t = L(); let h = "";
  if (confirming) h += `<div class="banner confirm"><span>${t.confirmQ}</span><button class="btn danger" type="button" id="yesReset">${t.yes}</button><button class="btn" type="button" id="noReset">${t.no}</button></div>`;
  $("banners").innerHTML = h;
}
function renderLegend() {
  const t = L();
  $("passNote").innerHTML = t.passInfo;
  $("legend").innerHTML = `<span><i class="pt" style="--c:var(--done)"></i>${t.lgDone}</span><span><i class="pt hollow" style="--c:var(--open)"></i>${t.lgOpen}</span><span><i class="pt" style="--c:var(--retry)"></i>${t.lgRetry}</span><span style="color:var(--lock)">${ICON.lock}</span><span style="margin-inline-start:-12px">${t.lgLock}</span>`;
}

function render() {
  applyChrome();
  const has = !!S.track;
  $("onboard").hidden = has; $("app").hidden = !has; $("appTools").hidden = !has;
  if (!has) {
    drawHero(); $("trackStat").innerHTML = trackCard("stat"); $("trackAi").innerHTML = trackCard("ai");
    $("drawer").hidden = true; $("scrim").hidden = true; return;
  }
  renderBanners(); renderSummary(); renderAlerts(); renderLegend(); renderPlan(); renderLab(); renderWhatIf(); renderTools(); renderRecord(); renderDrawer();
}

/* ---------- actions ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.track) { S.track = t.dataset.track; save(); render(); scrollTo(0, 0); return; }
  if (t.dataset.code) { selected = selected === t.dataset.code ? null : t.dataset.code; render(); return; }
  if (t.dataset.go) { selected = t.dataset.go; render(); return; }
  if (t.dataset.grade) { const a = [...attempts(selected)]; if (!a.length) a.push(t.dataset.grade); else a[a.length - 1] = t.dataset.grade; S.att[selected] = a; save(); render(); return; }
  if (t.dataset.pass) { for (const c of visible().filter(c => c.level === +t.dataset.pass)) if (!passed(c.code)) S.att[c.code] = [...attempts(c.code), "P"]; save(); render(); return; }
  if (t.dataset.unpass) { for (const c of visible().filter(c => c.level === +t.dataset.unpass)) { const a = attempts(c.code).filter(x => x !== "P"); if (a.length) S.att[c.code] = a; else delete S.att[c.code]; } save(); render(); return; }
  if (t.dataset.gender) { S.gender = t.dataset.gender; save(); render(); return; }
  if (t.dataset.rlike != null) { rateDraft[selected] = { ...rateDraft[selected], liked: t.dataset.rlike === "1" }; renderRating(selected); return; }
  if (t.dataset.rdiff) { rateDraft[selected] = { ...rateDraft[selected], difficulty: +t.dataset.rdiff }; renderRating(selected); return; }
  if (t.dataset.rep) { Ratings.report(selected, +t.dataset.rep).then(() => { t.textContent = L().rReported; t.disabled = true; }); return; }
  if (t.id === "rSend") {
    const tt = L(), dr = rateDraft[selected] || {}, msg = $("rMsg"), tx = ($("rText").value || "").trim();
    if (dr.liked == null || !dr.difficulty) { msg.className = "rerr"; msg.textContent = tt.rNeed; return; }
    const err = checkComment(tx); if (err) { msg.className = "rerr"; msg.textContent = err; return; }
    t.disabled = true;
    Ratings.rate(selected, dr.liked, dr.difficulty, tx).then(() => { rateDraft[selected] = { ...dr, comment: tx }; return renderRating(selected); })
      .then(() => { const m = $("rMsg"); if (m) { m.className = "rok"; m.textContent = L().rThanks; } })
      .catch(() => { t.disabled = false; msg.className = "rerr"; msg.textContent = tt.rFail; });
    return;
  }
  if (t.dataset.alert) { S.hideAlerts = { ...(S.hideAlerts || {}), [t.dataset.alert]: true }; save(); renderAlerts(); return; }
  if (t.dataset.lab) { S.labTab = t.dataset.lab; save(); renderLab(); return; }
  if (t.id === "mcAgain") { S.seed = (Math.random() * 2 ** 31) | 0; save(); renderMC(); return; }
  if (t.dataset.tpreset) { S.target = +t.dataset.tpreset; save(); renderTools(); return; }
  if (t.dataset.tscope) { S.tScope = t.dataset.tscope; save(); renderTools(); return; }
  if (t.dataset.view) { S.wiView = t.dataset.view; save(); renderWhatIf(); return; }
  if (t.dataset.addmod) { const B = { ...planB() }; B.mods = [...B.mods, t.dataset.addmod === "delay" ? { type:"delay", code:"", n:1 } : { type:"fail", code:"", grade:"C" }]; S.wiB = B; save(); renderWhatIf(); return; }
  if (t.dataset.rmmod != null) { const B = { ...planB() }; B.mods = B.mods.filter((_, i) => i !== +t.dataset.rmmod); S.wiB = B; save(); render(); return; }
  if (t.dataset.del != null) { const a = [...attempts(selected)]; a.splice(+t.dataset.del, 1); if (a.length) S.att[selected] = a; else delete S.att[selected]; save(); render(); return; }
  switch (t.id) {
    case "addRetake": { const a = [...attempts(selected)]; if (a[a.length - 1] === "F") a.push("C"); else a.unshift("F"); S.att[selected] = a; save(); render(); break; }
    case "closeD": selected = null; render(); break;
    case "switchTrack": S.track = null; selected = null; save(); render(); break;
    case "resetBtn": confirming = true; render(); break;
    case "noReset": confirming = false; render(); break;
    case "yesReset": S.att = {}; confirming = false; selected = null; save(); render(); break;
    case "langBtn": S.lang = S.lang === "ar" ? "en" : "ar"; save(); render(); break;
    case "_": break;
    case "genderBtn": S.gender = S.gender === "m" ? "f" : "m"; save(); render(); break;
    case "themeBtn": S.theme = isDark() ? "light" : "dark"; save(); render(); break;
  }
});
$("scrim").addEventListener("click", () => { selected = null; render(); });
$("load").addEventListener("input", e => { S.load = +e.target.value; save(); renderSummary(); renderWhatIf(); updateTools(); });
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "loadA" || el.id === "loadB") el.nextElementSibling.textContent = el.value;
  if (el.id === "rText") { rateDraft[selected] = { ...rateDraft[selected], comment: el.value }; $("rCnt").textContent = `${el.value.length}/200`; }
  if (el.id === "tgIn") { const v = +el.value; if (v >= 1 && v <= 5) { S.target = v; save(); updateTools(); document.querySelectorAll("[data-tpreset]").forEach(b => b.classList.toggle("on", +b.dataset.tpreset === v)); } }
  if (el.id === "fnCur" || el.id === "fnMax") { S.fin = { cur: +$("fnCur").value || 0, finMax: +$("fnMax").value || 40 }; save(); updateTools(); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "loadA") { S.load = +el.value; save(); render(); refocus("loadA"); }
  if (el.id === "loadB") { S.wiB = { ...planB(), load:+el.value }; save(); render(); refocus("loadB"); }
  if (el.id === "summerA") { S.wiA = { ...(S.wiA || {}), summer: el.checked }; save(); render(); }
  if (el.id === "summerB") { S.wiB = { ...planB(), summer: el.checked }; save(); render(); }
  if (el.id === "startTerm") { S.start = +el.value; save(); render(); }
  if (el.dataset.mod != null) { const B = { ...planB() }; B.mods = B.mods.map((m, i) => i === +el.dataset.mod ? { ...m, [el.dataset.f]: el.dataset.f === "n" ? +el.value : el.value } : m); S.wiB = B; save(); render(); }
});
function refocus(id) { const el = $(id); if (el) el.focus(); }
document.addEventListener("toggle", e => { const d = e.target; if (d.id === "lab") { S.open = { ...(S.open || {}), lab: d.open }; save(); return; }
  if (d.matches && d.matches("details.sec")) { S.open = { ...(S.open || {}), [d.dataset.sec]: d.open }; save(); } }, true);
document.addEventListener("keydown", e => { if (e.key === "Escape" && selected) { selected = null; render(); } });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!S.theme) applyChrome(); }); } catch(e) {}
render();
</script>

</body>
